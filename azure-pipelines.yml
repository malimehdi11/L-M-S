trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo "Hello World" > file.txt
  displayName: 'Create file.txt with Hello World'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'file.txt'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish file.txt as artifact'
